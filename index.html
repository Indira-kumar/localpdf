<!DOCTYPE html>
<html lang="en">
  <head>

    <title>LocalPDF - Private PDF Tools</title>
    <meta name="description" content="All your PDF tools in one place. 100% private - your files never leave your browser." />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="twitter:image" content="https://localpdf.indirakumar.com/og-image.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "LocalPDF",

          "@type": "Offer",

  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">

    <script type="module" src="/src/main.tsx"></script>
